<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#193c32">
    <title>Little Grove | Grow at your own pace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --forest: #193c32;
            --leaf: #315d45;
            --cream: #fff8e8;
            --sunshine: #f4c86a;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            padding: 28px;
            color: var(--cream);
            font-family: "DM Sans", sans-serif;
            background:
                radial-gradient(ellipse at 50% 110%, rgba(207, 155, 91, .5), transparent 43%),
                radial-gradient(ellipse at 12% 25%, rgba(140, 181, 112, .38), transparent 30%),
                radial-gradient(ellipse at 90% 12%, rgba(81, 131, 94, .44), transparent 33%),
                linear-gradient(145deg, #142f2d 0%, #23523e 52%, #18382f 100%);
        }

        body::before, body::after {
            position: fixed;
            z-index: 0;
            content: "";
            pointer-events: none;
        }

        body::before {
            inset: 0;
            opacity: .35;
            background-image: radial-gradient(rgba(255, 248, 224, .65) 1px, transparent 1.5px);
            background-size: 74px 82px;
            mask-image: linear-gradient(to bottom, black, transparent 78%);
        }

        body::after {
            width: min(78vw, 850px);
            height: min(78vw, 850px);
            right: -29vw;
            bottom: -52vw;
            border: 1px solid rgba(246, 221, 158, .15);
            border-radius: 48% 52% 0 0;
            box-shadow: 0 0 0 35px rgba(246, 221, 158, .035), 0 0 0 75px rgba(246, 221, 158, .025);
            transform: rotate(-28deg);
        }

        .scene {
            position: relative;
            z-index: 1;
            width: min(100%, 760px);
            padding: clamp(42px, 9vw, 88px) 28px;
            text-align: center;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin: 0 0 22px;
            color: #e2d9af;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .2em;
            text-transform: uppercase;
        }

        .eyebrow::before, .eyebrow::after {
            width: 25px;
            height: 1px;
            content: "";
            background: rgba(226, 217, 175, .55);
        }

        h1 {
            max-width: 700px;
            margin: 0 auto;
            font-family: "Fraunces", Georgia, serif;
            font-size: clamp(3.25rem, 9vw, 6.8rem);
            font-weight: 600;
            letter-spacing: -.055em;
            line-height: .98;
            text-wrap: balance;
        }

        h1 span { color: var(--sunshine); font-style: italic; }

        .intro {
            max-width: 470px;
            margin: 24px auto 34px;
            color: rgba(255, 248, 232, .8);
            font-size: clamp(1rem, 2vw, 1.13rem);
            line-height: 1.75;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 13px;
        }

        .action {
            min-width: 148px;
            padding: 15px 25px;
            border: 1px solid rgba(255, 248, 232, .5);
            border-radius: 999px;
            color: var(--cream);
            font-size: .96rem;
            font-weight: 700;
            text-decoration: none;
            transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
        }

        .action:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(5, 23, 18, .22); }
        .action:focus-visible { outline: 3px solid var(--sunshine); outline-offset: 4px; }
        .action-primary { border-color: var(--sunshine); color: #263c2f; background: var(--sunshine); }
        .action-primary:hover { background: #ffdc8a; }
        .action-secondary { background: rgba(255, 255, 255, .06); backdrop-filter: blur(8px); }
        .action-secondary:hover { background: rgba(255, 255, 255, .14); }

        .footnote { margin: 25px 0 0; color: rgba(255, 248, 232, .59); font-size: .83rem; }

        .firefly {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ffe79b;
            box-shadow: 0 0 15px 4px rgba(255, 225, 135, .45);
            animation: drift 4s ease-in-out infinite alternate;
        }
        .firefly-one { top: 12%; left: 9%; }
        .firefly-two { top: 25%; right: 6%; width: 5px; height: 5px; animation-delay: -2s; }
        .firefly-three { right: 15%; bottom: 8%; width: 4px; height: 4px; animation-delay: -1s; }
        @keyframes drift { to { transform: translate(9px, -13px); opacity: .45; } }

        @media (max-width: 480px) {
            body { padding: 18px; }
            .scene { padding: 48px 8px; }
            .actions { gap: 10px; }
            .action { min-width: 0; flex: 1; padding: 14px 12px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <main class="scene">
        <span class="firefly firefly-one" aria-hidden="true"></span>
        <span class="firefly firefly-two" aria-hidden="true"></span>
        <span class="firefly firefly-three" aria-hidden="true"></span>
        <p class="eyebrow">A little room to grow</p>
        <h1>Make space for<br><span>yourself to bloom.</span></h1>
        <p class="intro">Tend to your goals one small task at a time. Your garden grows right along with you.</p>
        <nav class="actions" aria-label="Account">
            <a class="action action-secondary" href="/login">Log in</a>
            <a class="action action-primary" href="/signup">Sign up</a>
        </nav>
        <p class="footnote">Small steps. Softer days. A garden of your own.</p>
    </main>
</body>
</html>
